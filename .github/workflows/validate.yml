name: Validate Workflows

on:
  push:
    paths:
      - '.github/workflows/**'
  pull_request:
    paths:
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  validate-workflows:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Validate workflow syntax
      run: |
        echo "Validating GitHub workflow files..."

        # Check for common YAML syntax issues
        for file in .github/workflows/*.yml .github/workflows/*.yaml; do
          if [ -f "$file" ]; then
            echo "Checking $file..."
            # Basic YAML validation using python
            python3 -c "
import yaml
import sys
try:
    with open('$file', 'r') as f:
        yaml.safe_load(f)
    print('✓ $file is valid YAML')
except yaml.YAMLError as e:
    print('✗ $file has YAML syntax error:', e)
    sys.exit(1)
except Exception as e:
    print('✗ Error reading $file:', e)
    sys.exit(1)
"
          fi
        done

        echo "All workflow files validated successfully!"

  test-build-matrix:
    runs-on: windows-latest

    strategy:
      matrix:
        configuration: [Debug, Release]
        platform: [Any CPU, x86]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Test matrix configuration
      run: |
        Write-Host "Testing matrix configuration:"
        Write-Host "Configuration: ${{ matrix.configuration }}"
        Write-Host "Platform: ${{ matrix.platform }}"

        # Test that we can parse the platform correctly
        $platform = "${{ matrix.platform }}"
        $platformSafe = if ($platform -eq "Any CPU") { "AnyCPU" } else { $platform }

        Write-Host "Platform (safe): $platformSafe"
        Write-Host "Matrix test completed successfully!"
