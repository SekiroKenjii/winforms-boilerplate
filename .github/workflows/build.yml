name: Build

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '9.0.x'
  SOLUTION_FILE: 'WinformsBoilerplate.sln'
  ARTIFACT_NAME: 'WinformsBoilerplate'

jobs:
  build:
    runs-on: windows-latest

    strategy:
      matrix:
        configuration: [Release]
        platform: [Any CPU, x86]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ${{ runner.os == 'Windows' && '~\.nuget\packages' || '~/.nuget/packages' }}
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json', '**/*.csproj', '**/Directory.Packages.props') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore ${{ env.SOLUTION_FILE }} --verbosity normal

    - name: Build solution
      run: dotnet build ${{ env.SOLUTION_FILE }} --no-restore --configuration ${{ matrix.configuration }} --platform "${{ matrix.platform }}" --verbosity normal

    - name: Run tests
      run: dotnet test ${{ env.SOLUTION_FILE }} --no-build --configuration ${{ matrix.configuration }} --platform "${{ matrix.platform }}" --verbosity normal    - name: Publish application
      run: |
        $platform = "${{ matrix.platform }}"
        $runtimeId = if ($platform -eq "x86") { "win-x86" } else { "win-x64" }

        dotnet publish src/WinformsBoilerplate.App/WinformsBoilerplate.App.csproj `
          --configuration ${{ matrix.configuration }} `
          --runtime $runtimeId `
          --self-contained true `
          --output "./publish/$runtimeId/" `
          --verbosity normal

    - name: Create release archive
      run: |
        $platform = "${{ matrix.platform }}"
        $runtimeId = if ($platform -eq "x86") { "win-x86" } else { "win-x64" }
        $archiveName = "${{ env.ARTIFACT_NAME }}-$runtimeId"

        Compress-Archive -Path "./publish/$runtimeId/*" -DestinationPath "./$archiveName.zip"

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.ARTIFACT_NAME }}-${{ matrix.platform == 'Any CPU' && 'win-x64' || 'win-x86' }}
        path: ./${{ env.ARTIFACT_NAME }}-${{ matrix.platform == 'Any CPU' && 'win-x64' || 'win-x86' }}.zip
        retention-days: 90

  release:
    runs-on: windows-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: ./artifacts/

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: ./artifacts/**/*.zip
        draft: false
        prerelease: ${{ contains(github.ref, '-') }}
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
